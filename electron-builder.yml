appId: io.sslip.classroom.teacher
productName: Classroom Teacher
copyright: Copyright Classroom
directories:
  output: release
  buildResources: build
files:
  - dist/**
  # Source maps help nobody on a teacher's PC; the installer has to stay under 100 MB.
  - '!dist/**/*.map'
  - package.json
# The UI is English only: Chromium's other 54 locale packs were ~45 MB of the install.
electronLanguages:
  - en-US
compression: maximum
# No update feed (the app is not auto-updated; the school server advertises new
# builds, see README "Security, sessions and updates"), so no latest.yml either.
publish: null
extraResources:
  - from: native/affinity-helper.exe
    to: affinity-helper.exe
  # Native screen-share publisher (Option A); optional at runtime (fallback: Electron publishes).
  - from: native/share-sidecar.exe
    to: share-sidecar.exe
  # Window and tray icons; main.ts iconDir() reads resources/build when packaged.
  - from: build
    to: build
    filter:
      - icon.png
      - tray.png
      - tray-alert.png
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  # Edit (rcedit) stays on so the exe gets the icon and version info. No
  # certificate is configured, so nothing is signed.
  signAndEditExecutable: true
  forceCodeSigning: false
nsis:
  # Differential (blockmap) packages compress file by file; there is no updater, so one solid archive.
  differentialPackage: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Classroom Teacher
portable:
  artifactName: ClassroomTeacher-portable.exe
artifactName: ClassroomTeacher-setup.${ext}
