# Template for infra/livekit.yaml. DO NOT put real keys in this file.
#
# infra/livekit.yaml is generated by scripts/sync-livekit-keys.sh from .env and
# is gitignored: it contains the LiveKit API secret, which is an ADMIN
# credential for the SFU. The placeholders below are replaced by that script.
port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  # One UDP port per ICE candidate by default. 50000–60000 is ~10k ports, enough
  # for 2,500 students (typically 1–2 ports each) plus a teacher share. LiveKit
  # uses all cores; leave WEB_WORKERS below the host CPU count so encoding still
  # has room (docs/CAPACITY.md).
  port_range_start: 50000
  port_range_end: 60000
  # Alternative for 2,500+ on one NIC: single-port UDP mux. Comment the
  # port_range_* pair above and set:
  #   udp_port: 7882
  # Then open 7882/udp instead of 50000–60000. ICE still advertises the public IP.
  # false for local demos; true (or set LIVEKIT_NODE_IP) on a public VPS
  use_external_ip: __USE_EXTERNAL_IP__
__NODE_IP_LINE__
redis:
  address: 127.0.0.1:6379
keys:
  __LIVEKIT_API_KEY__: __LIVEKIT_API_SECRET__
# Room/participant events → web app. Drives "students are force-muted while
# the teacher is not connected" (apps/web/src/app/api/livekit/webhook).
# api_key must be one of the keys above: LiveKit signs each delivery with its
# secret and the web app verifies it (WebhookReceiver). Host networking, so the
# web service is on loopback. Override with LIVEKIT_WEBHOOK_URL in .env.
webhook:
  api_key: __LIVEKIT_API_KEY__
  urls:
    - __LIVEKIT_WEBHOOK_URL__
logging:
  level: info
room:
  # Screen share publishes VP9 (L1T3 simulcast, needs server >= 1.13.6 for SVC
  # simulcast) with a VP8 backup codec for subscribers that cannot decode VP9
  # (older iOS Safari). Opus + RED for audio. Dynacast / adaptive stream are
  # client options (ClassroomRoom) and need nothing here.
  enabled_codecs:
    - mime: audio/opus
    - mime: audio/red
    - mime: video/vp8
    - mime: video/h264
    - mime: video/vp9
  auto_create: true
  # Seconds an empty room stays before LiveKit deletes it. 5 min covers a
  # teacher refresh / device switch without dropping the SFU room.
  empty_timeout: 300
  # Seconds to keep the ROOM open after the last participant leaves (LiveKit
  # default is 20). This is not how quickly a crashed participant is detected.
  # livekit-server v1.13.9 hardcodes the signal ping at a 5s interval and a 15s
  # timeout (pkg/rtc/participant.go PingIntervalSeconds / PingTimeoutSeconds).
  # rtc.ping_interval and rtc.ping_timeout are not config keys on this version
  # and are ignored. Crashed students leave the roster via LiveKit disconnect /
  # webhook (~20s) plus the web heartbeat (≥30s, jittered). Production
  # infra/livekit.yaml is generated from this file: regenerate it (or add this
  # key) and restart LiveKit.
  departure_timeout: 10
  # 0 = unlimited. Capacity is ports, CPU and egress, not this flag.
  max_participants: 0

# TURN relay for students behind strict firewalls / UDP-blocked networks.
# TURN/TLS on 5349 uses the certificate Caddy obtained for the LiveKit host
# (docker-compose mounts caddy_data at /caddy-data). Open 5349/tcp and
# 3478/udp in the firewall / security group.
# turn:
#   enabled: true
#   domain: livekit.example.com
#   tls_port: 5349
#   udp_port: 3478
#   external_tls: false
#   cert_file: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/livekit.example.com/livekit.example.com.crt
#   key_file: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/livekit.example.com/livekit.example.com.key
