# Template for infra/livekit.yaml. DO NOT put real keys in this file.
#
# infra/livekit.yaml is generated by scripts/sync-livekit-keys.sh from .env and
# is gitignored: it contains the LiveKit API secret, which is an ADMIN
# credential for the SFU. The placeholders below are replaced by that script.
port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # false for local demos; true (or set LIVEKIT_NODE_IP) on a public VPS
  use_external_ip: __USE_EXTERNAL_IP__
__NODE_IP_LINE__
redis:
  address: 127.0.0.1:6379
keys:
  __LIVEKIT_API_KEY__: __LIVEKIT_API_SECRET__
logging:
  level: info
room:
  auto_create: true
  empty_timeout: 300
  max_participants: 200
