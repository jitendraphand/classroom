port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # false for local demos; true (or set LIVEKIT_NODE_IP) on public VPS — run scripts/sync-livekit-keys.sh
  use_external_ip: false
redis:
  address: 127.0.0.1:6379
keys:
  devkey: replace-with-long-random-secret
logging:
  level: info
room:
  auto_create: true
  empty_timeout: 300
  max_participants: 200
