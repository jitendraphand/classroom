# LiveKit config for a standalone media node. Copy to infra/livekit-media.yaml
# (untracked) and fill in the keys. Each node may use its own key pair; list it
# in LIVEKIT_SERVERS on the web server.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # Alternative: single-port UDP mux (comment port_range_* and set udp_port: 7882).
  use_external_ip: true
keys:
  # REPLACE: api key: secret (never commit real values)
  APIxxxxxxxx: change-me-to-a-long-random-secret
# Same server version as the main node. departure_timeout is how long an empty
# room stays open after the last participant leaves. It does not speed up
# crashed-participant detection (that ping is hardcoded in v1.13.9; see
# infra/livekit.example.yaml). rtc.ping_interval / rtc.ping_timeout are ignored.
room:
  auto_create: true
  empty_timeout: 300
  departure_timeout: 10
  max_participants: 0
# Webhooks go to the ONE web server (presence / attendance / mic lock).
webhook:
  api_key: APIxxxxxxxx
  urls:
    - https://WEB_DOMAIN/api/livekit/webhook
# Optional embedded TURN/TLS (same as the main server's infra/livekit.yaml):
# turn:
#   enabled: true
