# Host networking on a single Linux VM/VPS:
# - LiveKit WebRTC UDP/TCP bind directly on the host (best path for public IP).
# - Postgres/Redis/LiveKit/web share 127.0.0.1 for server-side traffic.
# - Bare IP HTTP: set APP_URL / NEXT_PUBLIC_* to http://PUBLIC_IP:3000 and
#   ws://PUBLIC_IP:7880 (see docs/DEPLOY-VPS.md + scripts/configure-public-ip.sh).
# - Domain HTTPS: DOMAIN + Caddy profile tls (see docs/DEPLOY-CADDY.md +
#   scripts/configure-domain-tls.sh). Do not expose 5432/6379 on the public firewall.
# - Sizing: ./scripts/configure-resources.sh detects the box (CPU, RAM, and
#   optionally EGRESS_MBPS) and writes the *_MEM_LIMIT / Postgres / Redis /
#   web worker / MEDIA_PROFILE values below into .env (docs/CONSTRAINED-DEPLOY.md).
#   A *_MEM_LIMIT or *_CPUS of 0 means no container limit.

# Container logs are capped (json-file rotation): an unrotated log is a disk-full
# outage waiting to happen on a small VPS.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILES:-3}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classroom}
      # No default: a missing POSTGRES_PASSWORD must fail loudly rather than
      # silently boot a database with a publicly documented credential.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-classroom}
    command:
      - postgres
      # Bind loopback only. The official image forces listen_addresses='*', which
      # published 5432 on every interface; the firewall was the only control.
      - -c
      - listen_addresses=127.0.0.1
      # Defaults fit a 2-4 GB box; scripts/configure-resources.sh scales them
      # to the host (docs/CONSTRAINED-DEPLOY.md, docs/CAPACITY.md).
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-512MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      # SSD-backed VPS: index scans are cheap; no parallel query storms on few cores.
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${POSTGRES_IO_CONCURRENCY:-100}
      - -c
      - max_parallel_workers_per_gather=${POSTGRES_PARALLEL_WORKERS:-0}
      - -c
      - checkpoint_completion_target=0.9
    shm_size: ${POSTGRES_SHM_SIZE:-128mb}
    mem_limit: ${POSTGRES_MEM_LIMIT:-0}
    cpus: ${POSTGRES_CPUS:-0}
    logging: *logging
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classroom} -d ${POSTGRES_DB:-classroom} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    # Loopback only, with a hard memory ceiling. Eviction is volatile-ttl: only
    # keys with an expiry can go, shortest-lived first (short caches and
    # throttles). The attendance queue, its in-flight batch, locks and room
    # state are never evicted to make room (allkeys-lru could silently drop
    # queued attendance events or single-use join-token markers).
    command:
      - redis-server
      - --appendonly
      - "yes"
      # everysec avoids AOF fsync storms under pub/sub; always is too slow at 2,500.
      - --appendfsync
      - everysec
      - --bind
      - 127.0.0.1
      - --port
      - "6379"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      # AOF only: an RDB snapshot forks the process (and can briefly double its
      # memory) on top of the AOF it already writes.
      - --save
      - ""
      - --maxmemory-policy
      - volatile-ttl
      - --tcp-keepalive
      - "60"
      # Soft/hard/seconds. Drop a stalled subscriber before Redis OOM.
      - --client-output-buffer-limit
      - pubsub 32mb 8mb 60
    mem_limit: ${REDIS_MEM_LIMIT:-0}
    cpus: ${REDIS_CPUS:-0}
    logging: *logging
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  livekit:
    image: livekit/livekit-server:v1.13.9
    restart: unless-stopped
    network_mode: host
    # Media first on a shared box: under CPU contention LiveKit gets 8× the
    # web workers' share (Docker default is 1024). Idle cores are still used
    # by everyone; this only decides who wins when all cores are busy.
    cpu_shares: 8192
    mem_limit: ${LIVEKIT_MEM_LIMIT:-0}
    cpus: ${LIVEKIT_CPUS:-0}
    logging: *logging
    command: ["--config", "/etc/livekit.yaml"]
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
      # Caddy's Let's Encrypt certificates, read by LiveKit's embedded TURN/TLS
      # (turn.cert_file / key_file in livekit.yaml). Restart livekit after a
      # renewal (~every 60 days) so it picks up the new certificate.
      - caddy_data:/caddy-data:ro
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Build-time fallbacks; runtime token API also uses env / request Host
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    network_mode: host
    # Lower CPU weight than LiveKit (cpu_shares 8192), plus WEB_NICE below.
    cpu_shares: 512
    mem_limit: ${WEB_MEM_LIMIT:-0}
    cpus: ${WEB_CPUS:-0}
    logging: *logging
    env_file:
      - .env
    # Admin bootstrap password file (gitignored ./secrets, mode 700, owned by the
    # container user 1001; prepared by scripts/create-admin.sh).
    volumes:
      - ./secrets:/app/secrets
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-classroom}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@127.0.0.1:5432/${POSTGRES_DB:-classroom}
      REDIS_URL: redis://127.0.0.1:6379
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_INTERNAL_URL: http://127.0.0.1:7880
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_VISIBLE_STUDENT_VIDEOS: ${MAX_VISIBLE_STUDENT_VIDEOS:-6}
      SAMPLE_ROTATION_SECONDS: ${SAMPLE_ROTATION_SECONDS:-8}
      SPEAKER_PIN_TTL_SECONDS: ${SPEAKER_PIN_TTL_SECONDS:-18}
      NODE_ENV: production
      PORT: "3000"
      # 0.0.0.0 for bare-IP deploys (browsers reach :3000); 127.0.0.1 behind
      # Caddy (scripts/configure-domain-tls.sh sets it) so :3000 is never
      # reachable from outside, whatever the firewall says.
      HOSTNAME: ${WEB_HOSTNAME:-0.0.0.0}
      # auto = every CPU on ≤ 8-CPU boxes, else WEB_CPU_FRACTION (0.5) of them
      # so LiveKit keeps the rest; the Prisma pool per worker (default 10)
      # shrinks to fit POSTGRES_MAX_CONNECTIONS (docs/SCALING.md).
      WEB_WORKERS: ${WEB_WORKERS:-auto}
      WEB_CPU_FRACTION: ${WEB_CPU_FRACTION:-0.5}
      DB_POOL_PER_WORKER: ${DB_POOL_PER_WORKER:-auto}
      # Web workers run at this nice level so LiveKit stays ahead (0 = off).
      WEB_NICE: ${WEB_NICE:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-100}
      # Share of RAM the web workers may use together (cluster.js sizes each
      # worker's heap from it); the rest is for LiveKit, Postgres and Redis.
      WEB_MEM_FRACTION: ${WEB_MEM_FRACTION:-0.35}
      # standard | low (lib/videoQuality): lower bitrates for small egress.
      MEDIA_PROFILE: ${MEDIA_PROFILE:-standard}
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    # Give `prisma migrate deploy` room to finish: the entrypoint traps
    # SIGTERM, so Docker must not SIGKILL mid-migration and leave a half-applied
    # entry in _prisma_migrations.
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 18
      start_period: 45s

  # Optional HTTPS/WSS terminator (Let's Encrypt). Not started unless profile tls:
  #   docker compose --profile tls up -d
  # Needs DOMAIN in .env + DNS A/AAAA; see docs/DEPLOY-CADDY.md
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    network_mode: host
    mem_limit: ${CADDY_MEM_LIMIT:-0}
    logging: *logging
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
