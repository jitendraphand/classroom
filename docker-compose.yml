# Host networking on a single Linux VM/VPS:
# - LiveKit WebRTC UDP/TCP bind directly on the host (best path for public IP).
# - Postgres/Redis/LiveKit/web share 127.0.0.1 for server-side traffic.
# - Bare IP HTTP: set APP_URL / NEXT_PUBLIC_* to http://PUBLIC_IP:3000 and
#   ws://PUBLIC_IP:7880 (see docs/DEPLOY-VPS.md + scripts/configure-public-ip.sh).
# - Domain HTTPS: DOMAIN + Caddy profile tls (see docs/DEPLOY-CADDY.md +
#   scripts/configure-domain-tls.sh). Do not expose 5432/6379 on the public firewall.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classroom}
      # No default: a missing POSTGRES_PASSWORD must fail loudly rather than
      # silently boot a database with a publicly documented credential.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-classroom}
    command:
      - postgres
      # Bind loopback only. The official image forces listen_addresses='*', which
      # published 5432 on every interface; the firewall was the only control.
      - -c
      - listen_addresses=127.0.0.1
      # Defaults sized for a large one-box deploy (docs/CAPACITY.md). A 2 GB VPS
      # should set POSTGRES_MAX_CONNECTIONS=50 and POSTGRES_SHARED_BUFFERS=256MB.
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-512MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-400}
    shm_size: 256mb
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classroom} -d ${POSTGRES_DB:-classroom} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    # Loopback only, with a hard memory ceiling and LRU eviction. The previous
    # config had maxmemory 0 + noeviction alongside AOF, so unbounded room keys
    # could grow until the 2 GB host was OOM-killed.
    command:
      - redis-server
      - --appendonly
      - "yes"
      # everysec avoids AOF fsync storms under pub/sub; always is too slow at 2,500.
      - --appendfsync
      - everysec
      - --bind
      - 127.0.0.1
      - --port
      - "6379"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-1gb}
      - --maxmemory-policy
      - allkeys-lru
      - --tcp-keepalive
      - "60"
      # Soft/hard/seconds. Drop a stalled subscriber before Redis OOM.
      - --client-output-buffer-limit
      - pubsub 32mb 8mb 60
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  livekit:
    image: livekit/livekit-server:v1.13.9
    restart: unless-stopped
    network_mode: host
    # Media first on a shared box: under CPU contention LiveKit gets 8× the
    # web workers' share (Docker default is 1024). Idle cores are still used
    # by everyone; this only decides who wins when all cores are busy.
    cpu_shares: 8192
    command: ["--config", "/etc/livekit.yaml"]
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
      # Caddy's Let's Encrypt certificates, read by LiveKit's embedded TURN/TLS
      # (turn.cert_file / key_file in livekit.yaml). Restart livekit after a
      # renewal (~every 60 days) so it picks up the new certificate.
      - caddy_data:/caddy-data:ro
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Build-time fallbacks; runtime token API also uses env / request Host
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    network_mode: host
    # Lower CPU weight than LiveKit (cpu_shares 8192), plus WEB_NICE below.
    cpu_shares: 512
    env_file:
      - .env
    # Admin bootstrap password file (gitignored ./secrets, mode 700, owned by the
    # container user 1001; prepared by scripts/create-admin.sh).
    volumes:
      - ./secrets:/app/secrets
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-classroom}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@127.0.0.1:5432/${POSTGRES_DB:-classroom}
      REDIS_URL: redis://127.0.0.1:6379
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_INTERNAL_URL: http://127.0.0.1:7880
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_VISIBLE_STUDENT_VIDEOS: ${MAX_VISIBLE_STUDENT_VIDEOS:-6}
      SAMPLE_ROTATION_SECONDS: ${SAMPLE_ROTATION_SECONDS:-8}
      SPEAKER_PIN_TTL_SECONDS: ${SPEAKER_PIN_TTL_SECONDS:-18}
      NODE_ENV: production
      PORT: "3000"
      # 0.0.0.0 for bare-IP deploys (browsers reach :3000); 127.0.0.1 behind
      # Caddy (scripts/configure-domain-tls.sh sets it) so :3000 is never
      # reachable from outside, whatever the firewall says.
      HOSTNAME: ${WEB_HOSTNAME:-0.0.0.0}
      # auto = every CPU on ≤ 8-CPU boxes, else WEB_CPU_FRACTION (0.5) of them
      # so LiveKit keeps the rest; the Prisma pool per worker (default 10)
      # shrinks to fit POSTGRES_MAX_CONNECTIONS (docs/SCALING.md).
      WEB_WORKERS: ${WEB_WORKERS:-auto}
      WEB_CPU_FRACTION: ${WEB_CPU_FRACTION:-0.5}
      DB_POOL_PER_WORKER: ${DB_POOL_PER_WORKER:-auto}
      # Web workers run at this nice level so LiveKit stays ahead (0 = off).
      WEB_NICE: ${WEB_NICE:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-400}
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    # Give `prisma migrate deploy` room to finish: the entrypoint traps
    # SIGTERM, so Docker must not SIGKILL mid-migration and leave a half-applied
    # entry in _prisma_migrations.
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  # Optional HTTPS/WSS terminator (Let's Encrypt). Not started unless profile tls:
  #   docker compose --profile tls up -d
  # Needs DOMAIN in .env + DNS A/AAAA; see docs/DEPLOY-CADDY.md
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    network_mode: host
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
