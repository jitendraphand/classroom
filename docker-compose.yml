# Host networking on a single Linux VM/VPS:
# - LiveKit WebRTC UDP/TCP bind directly on the host (best path for public IP).
# - Postgres/Redis/LiveKit/web share 127.0.0.1 for server-side traffic.
# - Bare IP HTTP: set APP_URL / NEXT_PUBLIC_* to http://PUBLIC_IP:3000 and
#   ws://PUBLIC_IP:7880 (see docs/DEPLOY-VPS.md + scripts/configure-public-ip.sh).
# - Domain HTTPS: DOMAIN + Caddy profile tls (see docs/DEPLOY-CADDY.md +
#   scripts/configure-domain-tls.sh). Do not expose 5432/6379 on the public firewall.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classroom}
      # No default: a missing POSTGRES_PASSWORD must fail loudly rather than
      # silently boot a database with a publicly documented credential.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-classroom}
    command:
      - postgres
      # Bind loopback only. The official image forces listen_addresses='*', which
      # published 5432 on every interface; the firewall was the only control.
      - -c
      - listen_addresses=127.0.0.1
      # Sized for a 2 GB VPS (the documented target host).
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_wal_size=512MB
      - -c
      - max_connections=50
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classroom} -d ${POSTGRES_DB:-classroom} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    # Loopback only, with a hard memory ceiling and LRU eviction. The previous
    # config had maxmemory 0 + noeviction alongside AOF, so unbounded room keys
    # could grow until the 2 GB host was OOM-killed.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --bind
      - 127.0.0.1
      - --port
      - "6379"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  livekit:
    image: livekit/livekit-server:v1.12.0
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Build-time fallbacks; runtime token API also uses env / request Host
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    # Admin bootstrap password file (gitignored ./secrets, mode 700, owned by the
    # container user 1001; prepared by scripts/create-admin.sh).
    volumes:
      - ./secrets:/app/secrets
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-classroom}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@127.0.0.1:5432/${POSTGRES_DB:-classroom}
      REDIS_URL: redis://127.0.0.1:6379
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_INTERNAL_URL: http://127.0.0.1:7880
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_VISIBLE_STUDENT_VIDEOS: ${MAX_VISIBLE_STUDENT_VIDEOS:-6}
      SAMPLE_ROTATION_SECONDS: ${SAMPLE_ROTATION_SECONDS:-8}
      SPEAKER_PIN_TTL_SECONDS: ${SPEAKER_PIN_TTL_SECONDS:-18}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    # Give `prisma migrate deploy` room to finish: the entrypoint traps
    # SIGTERM, so Docker must not SIGKILL mid-migration and leave a half-applied
    # entry in _prisma_migrations.
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  # Optional HTTPS/WSS terminator (Let's Encrypt). Not started unless profile tls:
  #   docker compose --profile tls up -d
  # Needs DOMAIN in .env + DNS A/AAAA; see docs/DEPLOY-CADDY.md
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
