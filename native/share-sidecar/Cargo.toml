[package]
name = "share-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
livekit = { version = "0.9", features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasapi = "0.19"
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
