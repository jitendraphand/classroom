name: Android teacher app

on:
  push:
    branches: [android]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-app.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode = 100 + commit count: needs the whole history.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Optional: a stable release key. Without these secrets the release APK
      # is unsigned (not installable); the debug APK is always installable.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: the release APK stays unsigned."
            exit 0
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          echo "CLASSROOM_SIGNING=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          CLASSROOM_DEFAULT_SERVER: ${{ vars.CLASSROOM_DEFAULT_SERVER }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: APK sizes
        run: |
          find app/build/outputs/apk -name '*.apk' -exec ls -l {} \;
          find app/build/outputs/apk -name '*.apk' -exec sha256sum {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: classroom-teacher-android
          path: apps/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/signing.properties"
