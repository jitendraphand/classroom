name: Android teacher app

on:
  push:
    branches: [android]
    paths:
      - 'apps/android/**'
      - '!apps/android/**/*.md'
      - '.github/workflows/android-app.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '!apps/android/**/*.md'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode = 100 + commit count: needs the whole history.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Optional: a stable release key. Without these secrets the release APK
      # is unsigned (not installable); the debug APK is always installable.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: the release APK stays unsigned."
            exit 0
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          echo "CLASSROOM_SIGNING=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          CLASSROOM_DEFAULT_SERVER: ${{ vars.CLASSROOM_DEFAULT_SERVER }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Version
        id: version
        run: |
          meta=app/build/outputs/apk/debug/output-metadata.json
          echo "name=$(jq -r '.elements[0].versionName' "$meta")" >> "$GITHUB_OUTPUT"
          echo "code=$(jq -r '.elements[0].versionCode' "$meta")" >> "$GITHUB_OUTPUT"

      - name: APK sizes
        run: |
          find app/build/outputs/apk -name '*.apk' -exec ls -l {} \;
          find app/build/outputs/apk -name '*.apk' -exec sha256sum {} \;

      # Updates install over the old app only with the same key (1.1.0: SHA-256 7cfe1e01…cad982).
      - name: Release certificate
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then echo "Release APK is unsigned."; exit 0; fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "$apk" | grep -E 'SHA-256|DN'

      - uses: actions/upload-artifact@v4
        with:
          name: classroom-teacher-android
          path: apps/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/signing.properties"

  # Manual runs (Actions -> Android teacher app -> Run workflow) also publish
  # the APKs as a GitHub pre-release: a download link that does not expire
  # with the run's artifact. The unsigned release APK is left out (it does
  # not install).
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: classroom-teacher-android
          path: apk

      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          CODE: ${{ needs.build.outputs.code }}
        run: |
          set -eu
          mkdir out
          cp apk/debug/app-debug.apk out/classroom-teacher-debug.apk
          if [ -f apk/release/app-release.apk ]; then
            cp apk/release/app-release.apk out/classroom-teacher-release.apk
            release="- classroom-teacher-release.apk: for teachers. Signed with the release key; installs over earlier releases and keeps the sign-in."
          else
            release="- No release APK: the ANDROID_KEYSTORE_* secrets are not set, so the release build is unsigned and was left out."
          fi
          (cd out && sha256sum ./*.apk | sed 's# \./# #' > SHA256SUMS.txt)
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          notes=$(printf '%s\n\n%s\n%s\n\n%s' \
            "Android teacher app $VERSION (version code $CODE), branch $GITHUB_REF_NAME @ $short." \
            "- classroom-teacher-debug.apk: testing only. Debug key, so uninstall other builds first." \
            "$release" \
            "SHA-256 in SHA256SUMS.txt. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          gh release create "android-$VERSION-r$GITHUB_RUN_NUMBER" out/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Android teacher $VERSION (pre-release)" --notes "$notes"
